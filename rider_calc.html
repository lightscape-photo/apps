<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" id="themeColorMeta" content="#FFFFFF">
<title>UE跑跑算</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600&family=Bai+Jamjuree:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1F24;
    --panel:#23282F;
    --panel-2:#2C333C;
    --text:#EDEFF2;
    --muted:#8A929C;
    --amber:#FFB020;
    --amber-dim:#4A3A18;
    --green:#3DDC97;
    --green-dim:#1C3A2E;
    --red:#FF5C5C;
    --border:#343B44;
    --brand-uber-color:#fff;
    --on-green:#0C2A1E;
    --on-amber:#412402;
    --on-red:#3A0F0F;
  }
  html[data-theme="light"]{
    --bg:#FFFFFF;
    --panel:#FFFFFF;
    --panel-2:#F1F2F4;
    --text:#1B1F24;
    --muted:#6B7280;
    --amber:#92600A;
    --amber-dim:#FFF3D9;
    --green:#3B814B;
    --green-dim:#E4F2E8;
    --red:#C23A3A;
    --border:#E1E3E6;
    --brand-uber-color:#1B1F24;
    --on-green:#fff;
    --on-amber:#fff;
    --on-red:#fff;
  }
  html[data-theme="cyberpunk"]{
    --bg:#0A0E17;
    --panel:#140B28;
    --panel-2:#1F0F35;
    --text:#E8F4FF;
    --muted:#9A8BC2;
    --amber:#FF2A6D;
    --amber-dim:#3D0A22;
    --green:#05D9E8;
    --green-dim:#062830;
    --red:#FF3C64;
    --border:#331E52;
    --brand-uber-color:#05D9E8;
    --on-green:#0A0E17;
    --on-amber:#0A0E17;
    --on-red:#0A0E17;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans TC',-apple-system,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  .app{width:100%;max-width:480px;padding:20px 16px 60px;}
  .icon-btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    width:38px;height:38px;border-radius:10px;font-size:17px;cursor:pointer;flex-shrink:0;
  }
  .icon-btn:active{transform:scale(0.96);}

  .new-order-btn{
    flex:1;padding:16px 8px;border-radius:16px;border:2px dashed var(--amber);
    background:transparent;color:var(--amber);font-weight:600;font-size:15px;
    cursor:pointer;font-family:inherit;
  }
  .new-order-btn:active{background:var(--amber-dim);}

  .trash-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;margin-bottom:10px;
  }
  .trash-info{min-width:0;flex:1;}
  .trash-ordno{font-size:15px;font-weight:700;color:var(--text);font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;}
  .trash-meta{font-size:12px;color:var(--muted);margin-top:4px;font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;}
  .trash-restore-btn{
    flex:0 0 auto;background:var(--green);color:var(--on-green);border:none;
    border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:inherit;
  }
  .trash-restore-btn:active{transform:scale(0.96);}
  .new-order-row{display:flex;gap:10px;margin-bottom:18px;}
  .linked-btn{
    flex:1;padding:16px 8px;border-radius:16px;border:2px dashed var(--green);
    background:transparent;color:var(--green);font-weight:600;font-size:15px;
    cursor:pointer;font-family:inherit;
  }
  .linked-btn:active{background:var(--green-dim);}
  .link-badge{
    display:inline-block;font-size:11px;font-weight:600;color:var(--green);
    background:var(--green-dim);border-radius:6px;padding:2px 7px;margin-left:8px;
  }
  .locked-price{
    background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
    padding:6px 10px;font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;
    color:var(--muted);
  }

  .active-header{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px;}
  .active-header h2{font-size:14px;color:var(--muted);font-weight:600;margin:0;}
  .active-header .count{font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;font-size:13px;color:var(--amber);}

  .swipe-card-wrap{position:relative;margin-bottom:10px;border-radius:14px;overflow:hidden;}
  .order-card{
    position:relative;background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:12px 14px;touch-action:pan-y;
  }
  .ordno-price-row{display:flex;gap:8px;margin-bottom:10px;}
  .ordno-input{
    flex:1.8;min-width:0;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
    padding:8px 10px;font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;
    text-align:center;letter-spacing:1px;color:var(--text);
  }
  .ordno-input:focus{outline:none;border-color:var(--amber);}
  .ordno-input::placeholder{font-weight:400;font-size:13px;letter-spacing:normal;}
  .price-input-wrap{
    flex:0.8;min-width:0;display:flex;align-items:center;gap:2px;
    background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
    padding:8px 10px;
  }
  .price-input-wrap span{font-size:14px;color:var(--muted);}
  .price-input-wrap.locked-price{color:var(--muted);font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;}
  .price-input{
    flex:1;min-width:0;width:100%;background:transparent;border:none;outline:none;
    color:var(--text);font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;
    text-align:right;-moz-appearance:textfield;appearance:textfield;
  }
  .price-input::-webkit-outer-spin-button,.price-input::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0;
  }
  .price-input::placeholder{font-weight:400;font-size:13px;letter-spacing:normal;}
  .price-input:focus{outline:none;}
  .price-input-wrap:focus-within{border-color:var(--amber);}
  .order-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .order-start{font-size:12px;color:var(--muted);}
  .order-start b{color:var(--text);font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;}

  .order-status-row{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--border);
  }
  .order-timer{
    font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;
    letter-spacing:0.5px;flex-shrink:0;
  }
  .order-fee{font-size:11px;color:var(--muted);text-align:right;font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;}
  .order-fee.over{color:var(--amber);}

  .complete-btn{
    width:100%;padding:11px;border-radius:12px;border:none;background:var(--green);
    color:var(--on-green);font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;
  }
  .complete-btn:active{transform:scale(0.98);}
  .complete-btn.armed{background:var(--red);color:var(--on-red);}

  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;}
  .summary .card{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:12px 10px;
  }
  .summary .card .label{font-size:11px;color:var(--muted);line-height:1.4;}
  .summary .card .value{font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;margin-top:4px;}

  .history h2{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 10px 2px;}
  .order-item{
    display:flex;align-items:flex-start;gap:10px;
    padding:12px 4px 12px 12px;border-left:3px solid var(--amber);
    background:var(--panel);margin-bottom:8px;border-radius:0 10px 10px 0;
  }
  .order-item .idx{
    font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);
    min-width:22px;padding-top:2px;flex-shrink:0;
  }
  .order-item .body{flex:1;min-width:0;}
  .order-item .time-row{font-size:13px;color:var(--muted);margin-bottom:6px;}
  .order-item .time-row b{color:var(--text);font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;}
  .order-item .breakdown-mini{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
  .order-item .breakdown-mini .pair{font-size:12px;color:var(--muted);}
  .order-item .breakdown-mini .pair b{
    display:block;font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;
    color:var(--text);margin-top:2px;
  }
  .order-item .breakdown-mini .pair.fee b{color:var(--amber);}
  .order-item .amt{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    border-top:1px dashed var(--border);padding-top:6px;margin-top:2px;
  }
  .order-item .amt .total-val{font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;}
  .order-item .amt .total-label{font-size:12px;color:var(--muted);}
  .del-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px;}
  .del-btn:active{color:var(--red);}
  .empty{font-size:13px;color:var(--muted);text-align:center;padding:20px 0;}

  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;
    align-items:center;justify-content:center;z-index:10;padding:20px;
  }
  .overlay.show{display:flex;}
  .settings-panel{
    width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:20px;
  }
  .settings-panel h3{margin:0 0 6px;font-size:16px;}
  .settings-panel .hint{font-size:12px;color:var(--muted);margin:0 0 16px;line-height:1.6;}
  #deleteRowInfo{font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;}
  .settings-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .settings-row label{font-size:13px;color:var(--muted);}
  .settings-row input[type=number]{
    width:70px;background:transparent;border:none;outline:none;color:var(--text);
    font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;text-align:right;
  }
  .settings-actions{display:flex;gap:10px;margin-top:6px;}
  .quick-price-input-wrap{
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--panel-2);border:2px solid var(--border);border-radius:14px;
    padding:16px 18px;
  }
  .quick-price-input-wrap span{font-size:20px;color:var(--muted);font-weight:600;}
  .quick-price-input-wrap input{
    flex:1;min-width:0;width:100%;background:transparent;border:none;outline:none;
    color:var(--text);font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;font-size:32px;font-weight:700;
    text-align:center;-moz-appearance:textfield;appearance:textfield;
  }
  .quick-price-input-wrap input::-webkit-outer-spin-button,
  .quick-price-input-wrap input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .quick-price-input-wrap:focus-within{border-color:var(--amber);}
  .settings-actions button{
    flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .settings-actions .cancel{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .settings-actions .confirm{background:var(--amber);border:none;color:var(--on-amber);}

  .clear-all{font-size:12px;color:var(--muted);background:none;border:none;text-decoration:underline;cursor:pointer;}
  .history-actions{display:flex;align-items:center;justify-content:space-between;margin-top:14px;}
  .export-btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    font-size:13px;padding:9px 14px;border-radius:10px;cursor:pointer;
    font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;
  }
  .export-btn:active{transform:scale(0.97);}
  .export-table{width:100%;table-layout:fixed;border-collapse:collapse;margin-top:14px;font-size:11px;}
  .export-table th,.export-table td{
    padding:6px 2px;text-align:center;border-bottom:1px solid var(--border);
    font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;white-space:normal;word-break:break-word;overflow-wrap:break-word;
  }
  .export-table th{color:var(--muted);font-family:'IBM Plex Sans TC',sans-serif;font-weight:600;font-size:10px;text-align:center;}
  .export-table tbody tr:last-child td{border-bottom:none;}
  .row-id-cell{-webkit-user-select:none;user-select:none;cursor:pointer;}
  .export-table tfoot td{border-top:1px solid var(--border);border-bottom:none;color:var(--amber);font-weight:600;padding-top:10px;}
  .export-table-scroll{overflow-x:hidden;}
  .detail-edit-input{
    width:100%;background:transparent;border:none;border-bottom:1px dashed var(--border);
    color:var(--text);font-family:'Bai Jamjuree','IBM Plex Sans TC',sans-serif;font-variant-numeric:tabular-nums;font-size:inherit;
    text-align:center;padding:2px 0;min-width:0;box-sizing:border-box;
  }
  .detail-edit-input:focus{outline:none;border-bottom:1px solid var(--amber);}
  .base-edit-input{-moz-appearance:textfield;appearance:textfield;}
  .base-edit-input::-webkit-outer-spin-button,.base-edit-input::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0;
  }
  .time-edit-input{font-size:11px;padding:2px;}
  .ordno-edit-input{font-weight:600;}
  .export-table th:nth-child(4),.export-table td:nth-child(4),
  .export-table th:nth-child(5),.export-table td:nth-child(5){width:16%;}
  .export-table th:nth-child(1),.export-table td:nth-child(1),
  .export-table th:nth-child(6),.export-table td:nth-child(6){width:9%;}
  .export-empty{font-size:13px;color:var(--muted);text-align:center;padding:16px 0;}

  .tabs{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--border);margin-bottom:18px;}
  .tab-group{display:flex;gap:22px;}
  .brand-label{font-family:'Poppins',sans-serif;font-size:24px;font-weight:500;padding-bottom:5px;letter-spacing:0.2px;}
  .brand-uber{color:var(--brand-uber-color);}
  .brand-eats{color:var(--green);}
  .tab-btn{
    background:none;border:none;border-bottom:2px solid transparent;
    padding:9px 2px;color:var(--muted);font-weight:600;font-size:15px;
    cursor:pointer;font-family:inherit;
  }
  .tab-btn.active{color:var(--amber);border-bottom-color:var(--amber);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .theme-option-row{display:flex;gap:12px;flex-wrap:wrap;}
  .theme-option{
    flex:1;min-width:100px;display:flex;flex-direction:column;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px 10px;cursor:pointer;font-family:inherit;
  }
  .theme-option.active{border:2px solid var(--amber);}
  .theme-swatch{
    width:100%;height:48px;border-radius:8px;border:1px solid var(--border);
    display:block;
  }
  .theme-swatch-dark{background:#1B1F24;}
  .theme-swatch-light{background:#FFFFFF;}
  .theme-swatch-cyberpunk{background:linear-gradient(135deg,#FF2A6D 0%,#0A0E17 55%,#05D9E8 100%);}
  .theme-option-label{font-size:13px;color:var(--text);font-weight:600;text-align:center;line-height:1.5;}
  .theme-option-sub{font-size:11px;color:var(--muted);font-weight:400;}
</style>
</head>
<body>
<div class="app">
  <div class="tabs">
    <div class="tab-group">
      <button class="tab-btn active" data-tab="main">主頁</button>
      <button class="tab-btn" data-tab="detail">明細</button>
      <button class="tab-btn" data-tab="trash">垃圾桶</button>
      <button class="tab-btn" data-tab="settings">設定</button>
    </div>
    <span class="brand-label"><span class="brand-uber">Uber</span> <span class="brand-eats">Eats</span></span>
  </div>

  <div id="tabMain" class="tab-panel active">
    <div class="new-order-row">
      <button class="new-order-btn" id="newOrderBtn">＋ 新增一單</button>
      <button class="linked-btn" id="newLinkedBtn">＋ 新增疊單</button>
    </div>

    <div class="active-header">
      <h2>進行中的訂單</h2>
      <span class="count" id="activeCount">0 單</span>
    </div>
    <div id="activeList"><div class="empty">目前沒有進行中的訂單</div></div>

    <div class="summary">
      <div class="card">
        <div class="label">今日趟數</div>
        <div class="value" id="todayCount">0</div>
      </div>
      <div class="card">
        <div class="label">淨收入</div>
        <div class="value" id="todayBaseSum">NT$0</div>
      </div>
      <div class="card">
        <div class="label">差額費</div>
        <div class="value" id="todayFeeSum">NT$0</div>
      </div>
    </div>
  </div>

  <div id="tabDetail" class="tab-panel">
    <div class="settings-row" style="flex-wrap:wrap;margin-bottom:12px;">
      <label>範圍</label>
      <select id="exportRange" style="background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px;font-family:inherit;font-size:14px;">
        <option value="today">今天</option>
        <option value="all">全部歷史</option>
        <option value="custom">自訂日期範圍</option>
      </select>
    </div>
    <div class="settings-row" id="customDateRow" style="display:none;margin-bottom:12px;">
      <input type="date" id="rangeStart" style="background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:7px;font-family:inherit;">
      <span style="color:var(--muted);">至</span>
      <input type="date" id="rangeEnd" style="background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:7px;font-family:inherit;">
    </div>
    <div id="exportPreviewWrap"></div>
    <div class="history-actions">
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="export-btn" id="exportCsvBtn">匯出 CSV</button>
        <button class="export-btn" id="importCsvBtn">匯入 CSV</button>
        <input type="file" id="importCsvInput" accept=".csv" style="display:none;">
      </div>
      <button class="clear-all" id="clearAllBtn" style="display:none;">清空所有紀錄</button>
    </div>
    <p id="importStatus" style="font-size:12px;color:var(--muted);margin-top:8px;"></p>
  </div>

  <div id="tabTrash" class="tab-panel">
    <div class="active-header">
      <h2>垃圾桶</h2>
    </div>
    <div id="trashList"><div class="empty">垃圾桶是空的</div></div>
    <div class="history-actions" style="justify-content:flex-end;">
      <button class="clear-all" id="clearTrashBtn" style="display:none;">清空垃圾桶</button>
    </div>
  </div>

  <div id="tabSettings" class="tab-panel">
    <div class="active-header">
      <h2>主題色</h2>
    </div>
    <div class="theme-option-row">
      <button class="theme-option" data-theme-choice="light">
        <span class="theme-swatch theme-swatch-light"></span>
        <span class="theme-option-label">白色主題<br><span class="theme-option-sub">預設</span></span>
      </button>
      <button class="theme-option" data-theme-choice="dark">
        <span class="theme-swatch theme-swatch-dark"></span>
        <span class="theme-option-label">深色主題</span>
      </button>
      <button class="theme-option" data-theme-choice="cyberpunk">
        <span class="theme-swatch theme-swatch-cyberpunk"></span>
        <span class="theme-option-label">賽博龐克</span>
      </button>
    </div>
  </div>
</div>

<div class="overlay" id="confirmClearOverlay">
  <div class="settings-panel" style="max-width:340px;text-align:center;">
    <h3 style="margin-bottom:10px;">清空所有紀錄？</h3>
    <p class="hint" style="margin-bottom:18px;">這會刪除全部歷史紀錄，且無法復原。建議先用「匯出 CSV」備份。</p>
    <div class="settings-actions">
      <button class="cancel" id="confirmClearCancel">取消</button>
      <button class="confirm" id="confirmClearOk" style="background:var(--red);color:var(--on-red);">確定清空</button>
    </div>
  </div>
</div>

<div class="overlay" id="confirmClearTrashOverlay">
  <div class="settings-panel" style="max-width:340px;text-align:center;">
    <h3 style="margin-bottom:10px;">清空垃圾桶？</h3>
    <p class="hint" style="margin-bottom:18px;">垃圾桶裡的訂單會被永久刪除，無法再還原。</p>
    <div class="settings-actions">
      <button class="cancel" id="confirmClearTrashCancel">取消</button>
      <button class="confirm" id="confirmClearTrashOk" style="background:var(--red);color:var(--on-red);">確定清空</button>
    </div>
  </div>
</div>

<div class="overlay" id="confirmDeleteRowOverlay">
  <div class="settings-panel" style="max-width:340px;text-align:center;">
    <h3 style="margin-bottom:10px;">刪除這筆紀錄？</h3>
    <p class="hint" id="deleteRowInfo" style="margin-bottom:18px;"></p>
    <div class="settings-actions">
      <button class="cancel" id="confirmDeleteRowCancel">取消</button>
      <button class="confirm" id="confirmDeleteRowOk" style="background:var(--red);color:var(--on-red);">確定刪除</button>
    </div>
  </div>
</div>

<div class="overlay" id="quickPriceOverlay">
  <div class="settings-panel" style="max-width:320px;text-align:center;">
    <h3 style="margin-bottom:16px;">輸入單價</h3>
    <div class="quick-price-input-wrap">
      <span>NT$</span>
      <input type="number" id="quickPriceInput" inputmode="numeric" placeholder="0" min="0">
    </div>
    <div class="settings-actions" style="margin-top:20px;">
      <button class="cancel" id="quickPriceSkip">稍後再填</button>
      <button class="confirm" id="quickPriceOk" style="background:var(--green);color:var(--on-green);">確認</button>
    </div>
  </div>
</div>

<script>
const KEY_ACTIVE = 'meter_active';
const KEY_ORDERS = 'meter_orders';

let active = [];
let orders = [];

const $ = id => document.getElementById(id);

function loadJSON(key, fallback){
  try{
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  }catch(e){ return fallback; }
}
function saveJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}
function genId(){
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,7);
}

function fmtHHMM(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function parseTimeInput(str){
  str = (str || '').trim();
  if(!str) return null;
  let h, m;
  if(str.includes(':')){
    const parts = str.split(':');
    if(parts.length !== 2) return null;
    h = parseInt(parts[0], 10);
    m = parseInt(parts[1], 10);
  }else{
    const digits = str.replace(/\D/g, '');
    if(digits.length === 3){
      h = parseInt(digits.slice(0,1), 10);
      m = parseInt(digits.slice(1), 10);
    }else if(digits.length === 4){
      h = parseInt(digits.slice(0,2), 10);
      m = parseInt(digits.slice(2), 10);
    }else{
      return null;
    }
  }
  if(isNaN(h) || isNaN(m) || h < 0 || h > 23 || m < 0 || m > 59) return null;
  return { h, m };
}
function fmtMMSS(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(totalSec/60);
  const s = totalSec%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function money(n){
  const r = Math.round(n*10)/10;
  return 'NT$' + (Number.isInteger(r) ? r : r.toFixed(1));
}
function moneyExport(n){
  const r = Math.round(n*10)/10;
  return (Number.isInteger(r) ? r : r.toFixed(1)) + '元';
}
function plainNum(n){
  const r = Math.round(n*10)/10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}
function calculateDeliverySubsidy(basePrice, actualMinutes){
  // 1. 根據專法計算出這趟行程的「法定保障總額」 (每分鐘4.1元與45元擇高)
  const timeGuarantee = actualMinutes * 4.1;
  const legalGuarantee = Math.max(45, timeGuarantee);

  // 2. 計算應補差額 (保障總額 扣掉 初始起價)
  let subsidy = legalGuarantee - basePrice;

  // 3. 防呆機制：如果起價很高，差額為負數時，畫面顯示 0 元 (不補也不扣)
  if(subsidy < 0){
    subsidy = 0;
  }

  // 回傳四捨五入後的整數金額
  return Math.round(subsidy);
}
function calcFee(startTs, endTs, basePrice){
  const price = basePrice || 0;
  const elapsedMs = endTs - startTs;
  const elapsedMinCeil = Math.max(0, Math.ceil(elapsedMs/60000));
  let firstOverMin = 0;
  while(calculateDeliverySubsidy(price, firstOverMin) <= 0 && firstOverMin < 100000){
    firstOverMin++;
  }
  const thresholdMin = Math.max(0, firstOverMin - 1);
  const extraMin = Math.max(0, elapsedMinCeil - thresholdMin);
  const extraFee = Math.round(extraMin * 4.1);
  return { elapsedMinCeil, thresholdMin, extraMin, extraFee };
}
function getFeeStatus(o, now){
  if(!o.basePrice || o.basePrice <= 0){
    return { text: '請先輸入單價', over: false };
  }
  const { thresholdMin, extraMin, extraFee } = calcFee(o.startTs, now, o.basePrice);
  if(extraFee > 0){
    return { text: `已超時 ${extraMin} 分鐘，+${money(extraFee)}`, over: true };
  }
  const targetTs = o.startTs + thresholdMin * 60000;
  const remainStr = fmtMMSS(targetTs - now);
  return { text: `還有 ${remainStr} 開始補差額`, over: false };
}

function init(){
  active = loadJSON(KEY_ACTIVE, []);
  orders = loadJSON(KEY_ORDERS, []);
  trashItems = loadJSON(KEY_TRASH, []);
  let migrated = false;
  orders.forEach(o=>{
    const rounded = Math.round(o.extraFee);
    if(rounded !== o.extraFee){
      o.extraFee = rounded;
      o.total = (o.basePrice || 0) + rounded;
      migrated = true;
    }
  });
  if(migrated) saveJSON(KEY_ORDERS, orders);
  applyTheme(loadJSON(KEY_THEME, 'light'));
  renderActive();
  computeTodaySummary();
  renderDetailTable();
  renderTrash();
  setInterval(tick, 1000);
}

let pendingNewIds = [];
let pendingPriceIds = [];
$('newOrderBtn').addEventListener('click', ()=>{
  const id = genId();
  active.push({ id, basePrice: 0, startTs: Date.now() });
  saveJSON(KEY_ACTIVE, active);
  pendingNewIds = [id];
  renderActive();
  openQuickPrice([id]);
});

$('newLinkedBtn').addEventListener('click', ()=>{
  const groupId = genId();
  const now = Date.now();
  const idA = genId();
  const idB = genId();
  active.push({ id: idA, basePrice: 0, startTs: now, linkGroupId: groupId, linkRole: 'primary' });
  active.push({ id: idB, basePrice: 0, startTs: now, linkGroupId: groupId, linkRole: 'secondary' });
  saveJSON(KEY_ACTIVE, active);
  pendingNewIds = [idA, idB];
  renderActive();
  openQuickPrice([idA, idB]);
});

function openQuickPrice(ids){
  pendingPriceIds = ids;
  const input = $('quickPriceInput');
  input.value = '';
  $('quickPriceOverlay').classList.add('show');
  requestAnimationFrame(()=> input.focus());
}
function closeQuickPrice(){
  pendingPriceIds = [];
  $('quickPriceInput').blur();
  $('quickPriceOverlay').classList.remove('show');
}
$('quickPriceSkip').addEventListener('click', closeQuickPrice);
$('quickPriceOk').addEventListener('click', ()=>{
  const val = parseFloat($('quickPriceInput').value) || 0;
  pendingPriceIds.forEach(id=>{
    const o = active.find(a=>a.id===id);
    if(o) o.basePrice = val;
  });
  saveJSON(KEY_ACTIVE, active);
  renderActive();
  closeQuickPrice();
});
$('quickPriceInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter') $('quickPriceOk').click();
});

function renderActive(){
  armedIds.clear();
  const list = $('activeList');
  $('activeCount').textContent = active.length + ' 單';

  const prevRects = {};
  list.querySelectorAll('.swipe-card-wrap').forEach(el=>{
    prevRects[el.getAttribute('data-swipe-card')] = el.getBoundingClientRect();
  });

  if(active.length === 0){
    list.innerHTML = '<div class="empty">目前沒有進行中的訂單</div>';
    return;
  }
  const sorted = [...active].sort((a,b)=>b.startTs-a.startTs);
  const now0 = Date.now();
  list.innerHTML = sorted.map(o => {
    const isPrimary = o.linkRole === 'primary';
    const isSecondary = o.linkRole === 'secondary';
    const badge = isPrimary ? '<span class="link-badge">疊單 A</span>' : isSecondary ? '<span class="link-badge">疊單 B</span>' : '';
    const priceField = isSecondary
      ? `<div class="price-input-wrap locked-price"><span>NT$</span><span data-locked-display="${o.id}">${plainNum(o.basePrice)}</span></div>`
      : `<div class="price-input-wrap"><span>NT$</span><input type="number" class="price-input" data-base="${o.id}" value="${o.basePrice || ''}" placeholder="單價" min="0"></div>`;
    const feeStatus = getFeeStatus(o, now0);
    return `
    <div class="swipe-card-wrap" data-swipe-card="${o.id}">
      <div class="order-card" data-order-id="${o.id}">
        <div class="ordno-price-row">
          <input type="text" class="ordno-input" data-ordno="${o.id}" value="${o.orderNo ? o.orderNo.replace(/"/g,'&quot;') : ''}" placeholder="單號" lang="en" inputmode="text" autocapitalize="characters" autocorrect="off" autocomplete="off" spellcheck="false">
          ${priceField}
        </div>
        <div class="order-head">
          <span class="order-start">開始 <b>${fmtHHMM(o.startTs)}</b>${badge}</span>
        </div>
        <div class="order-status-row">
          <span class="order-timer" data-timer="${o.id}">00:00</span>
          <span class="order-fee${feeStatus.over ? ' over' : ''}" data-fee="${o.id}">${feeStatus.text}</span>
        </div>
        <button class="complete-btn" data-complete="${o.id}">完成</button>
      </div>
    </div>
  `;
  }).join('');

  initCardSwipeCancel();

  const wraps = Array.from(list.querySelectorAll('.swipe-card-wrap'));
  const animating = [];
  wraps.forEach((el, idx)=>{
    const id = el.getAttribute('data-swipe-card');
    const prev = prevRects[id];
    el.style.zIndex = String(wraps.length - idx);
    if(!prev) return;
    const next = el.getBoundingClientRect();
    const dy = prev.top - next.top;
    if(Math.abs(dy) < 1) return;
    animating.push({ el, dy });
  });
  animating.forEach(({el, dy})=>{
    el.style.transition = 'none';
    el.style.transform = `translateY(${dy}px)`;
  });
  if(animating.length){
    void list.offsetHeight;
    requestAnimationFrame(()=>{
      animating.forEach(({el})=>{
        el.style.transition = 'transform 0.15s ease';
        el.style.transform = 'translateY(0)';
      });
      setTimeout(()=>{
        animating.forEach(({el})=>{
          el.style.transition = '';
          el.style.transform = '';
          el.style.zIndex = '';
        });
      }, 170);
    });
  }

  if(pendingNewIds.length){
    const newEls = pendingNewIds
      .map(id => list.querySelector(`.swipe-card-wrap[data-swipe-card="${id}"]`))
      .filter(Boolean);
    const pushDelay = animating.length ? 70 : 0;
    newEls.forEach(el=>{
      el.style.transition = 'none';
      el.style.transform = 'scale(0.92)';
      el.style.opacity = '0';
    });
    if(newEls.length){
      void list.offsetHeight;
      setTimeout(()=>{
        newEls.forEach(el=>{
          el.style.transition = 'transform 0.15s ease, opacity 0.15s ease';
          el.style.transform = 'scale(1)';
          el.style.opacity = '1';
        });
        setTimeout(()=>{
          newEls.forEach(el=>{
            el.style.transition = '';
            el.style.transform = '';
            el.style.opacity = '';
          });
        }, 170);
      }, pushDelay);
    }
    pendingNewIds = [];
  }
}

$('activeList').addEventListener('input', e=>{
  const baseId = e.target.getAttribute('data-base');
  const ordId = e.target.getAttribute('data-ordno');
  if(baseId){
    const o = active.find(a=>a.id===baseId);
    if(o){
      o.basePrice = parseFloat(e.target.value) || 0;
      if(o.linkRole === 'primary' && o.linkGroupId){
        active.filter(a => a.linkGroupId === o.linkGroupId && a.linkRole === 'secondary').forEach(sec=>{
          sec.basePrice = o.basePrice;
          const disp = document.querySelector(`[data-locked-display="${sec.id}"]`);
          if(disp) disp.textContent = plainNum(sec.basePrice);
          updateFeeDisplay(sec);
        });
      }
      saveJSON(KEY_ACTIVE, active);
      updateFeeDisplay(o);
    }
  }
  if(ordId){
    const o = active.find(a=>a.id===ordId);
    if(o){
      const upper = e.target.value.toUpperCase();
      o.orderNo = upper;
      if(e.target.value !== upper){
        const cursorPos = e.target.selectionStart;
        e.target.value = upper;
        e.target.setSelectionRange(cursorPos, cursorPos);
      }
      saveJSON(KEY_ACTIVE, active);
    }
  }
});

$('activeList').addEventListener('click', e=>{
  const completeBtn = e.target.closest('[data-complete]');
  if(completeBtn) handleCompleteClick(completeBtn);
});

const armedIds = new Set();
function handleCompleteClick(btn){
  const id = btn.getAttribute('data-complete');
  if(armedIds.has(id)){
    armedIds.delete(id);
    animateCompleteExit(id, ()=> completeOrder(id));
    return;
  }
  armedIds.add(id);
  btn.textContent = '確認完成';
  btn.classList.add('armed');
}

function animateCompleteExit(id, callback){
  const wrap = document.querySelector(`.swipe-card-wrap[data-swipe-card="${id}"]`);
  if(!wrap){ callback(); return; }
  const card = wrap.querySelector('.order-card');
  card.style.transition = 'transform 0.18s ease, opacity 0.18s ease';
  card.style.transform = 'scale(0.94)';
  card.style.opacity = '0';
  setTimeout(callback, 180);
}

function initCardSwipeCancel(){
  document.querySelectorAll('.swipe-card-wrap').forEach(wrap=>{
    const id = wrap.getAttribute('data-swipe-card');
    const card = wrap.querySelector('.order-card');
    let dragging = false;
    let decided = false;
    let cancelled = false;
    let startX = 0, startY = 0;
    let currentX = 0;

    function onPointerDown(e){
      if(e.target.closest('input, button')) return;
      dragging = true;
      decided = false;
      cancelled = false;
      currentX = 0;
      startX = e.clientX;
      startY = e.clientY;
      card.style.transition = 'none';
    }
    function onPointerMove(e){
      if(!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if(!decided){
        if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        decided = true;
        if(Math.abs(dy) > Math.abs(dx)){
          cancelled = true;
          dragging = false;
          return;
        }
        card.setPointerCapture(e.pointerId);
      }
      if(cancelled) return;
      currentX = Math.min(0, dx);
      card.style.transform = `translateX(${currentX}px)`;
      const maxDist = wrap.clientWidth * 0.15;
      const progress = Math.min(1, Math.abs(currentX) / maxDist);
      card.style.opacity = String(1 - progress * 0.6);
    }
    function onPointerUp(){
      if(!dragging) return;
      dragging = false;
      if(cancelled) return;
      const maxDist = wrap.clientWidth * 0.15;
      card.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
      if(Math.abs(currentX) >= maxDist){
        card.style.transform = `translateX(-${wrap.clientWidth}px)`;
        card.style.opacity = '0';
        setTimeout(()=> cancelOrder(id), 180);
      }else{
        card.style.transform = 'translateX(0)';
        card.style.opacity = '1';
      }
      currentX = 0;
    }
    wrap.addEventListener('pointerdown', onPointerDown);
    wrap.addEventListener('pointermove', onPointerMove);
    wrap.addEventListener('pointerup', onPointerUp);
    wrap.addEventListener('pointercancel', onPointerUp);
  });
}

function completeOrder(id){
  const idx = active.findIndex(a=>a.id===id);
  if(idx === -1) return;
  const o = active[idx];
  const endTs = Date.now();
  const { elapsedMinCeil, extraMin, extraFee } = calcFee(o.startTs, endTs, o.basePrice);
  const record = {
    id: genId(),
    orderNo: o.orderNo || '',
    basePrice: o.basePrice || 0,
    excludeBaseFromTotal: o.linkRole === 'secondary',
    startTs: o.startTs,
    endTs,
    elapsedMinCeil, extraMin, extraFee,
    total: (o.basePrice || 0) + extraFee
  };
  orders.unshift(record);
  active.splice(idx,1);
  saveJSON(KEY_ACTIVE, active);
  saveJSON(KEY_ORDERS, orders);
  renderActive();
  computeTodaySummary();
  renderDetailTable();
}

const KEY_TRASH = 'meter_trash';
let trashItems = [];

function cancelOrder(id){
  const idx = active.findIndex(a=>a.id===id);
  if(idx === -1) return;
  const item = active[idx];
  item.deletedAt = Date.now();
  trashItems.unshift(item);
  active.splice(idx,1);
  saveJSON(KEY_ACTIVE, active);
  saveJSON(KEY_TRASH, trashItems);
  renderActive();
  renderTrash();
}

function renderTrash(){
  const el = $('trashList');
  $('clearTrashBtn').style.display = trashItems.length === 0 ? 'none' : 'block';
  if(trashItems.length === 0){
    el.innerHTML = '<div class="empty">垃圾桶是空的</div>';
    return;
  }
  el.innerHTML = trashItems.map(item=>{
    const badge = item.linkRole === 'primary' ? '<span class="link-badge">疊單 A</span>' : item.linkRole === 'secondary' ? '<span class="link-badge">疊單 B</span>' : '';
    return `
    <div class="trash-row" data-trash-id="${item.id}">
      <div class="trash-info">
        <div class="trash-ordno">${item.orderNo ? item.orderNo : '（未填單號）'}${badge}</div>
        <div class="trash-meta">單價 NT$${item.basePrice || 0} · 開始 ${fmtHHMM(item.startTs)}</div>
      </div>
      <button class="trash-restore-btn" data-trash-restore="${item.id}">還原</button>
    </div>`;
  }).join('');
}
$('trashList').addEventListener('click', e=>{
  const btn = e.target.closest('[data-trash-restore]');
  if(!btn) return;
  const id = btn.getAttribute('data-trash-restore');
  const idx = trashItems.findIndex(t=>t.id===id);
  if(idx === -1) return;
  const item = trashItems[idx];
  delete item.deletedAt;
  active.push(item);
  trashItems.splice(idx,1);
  saveJSON(KEY_ACTIVE, active);
  saveJSON(KEY_TRASH, trashItems);
  renderActive();
  renderTrash();
});
$('clearTrashBtn').addEventListener('click', ()=>{
  $('confirmClearTrashOverlay').classList.add('show');
});
$('confirmClearTrashCancel').addEventListener('click', ()=>{
  $('confirmClearTrashOverlay').classList.remove('show');
});
$('confirmClearTrashOk').addEventListener('click', ()=>{
  trashItems = [];
  saveJSON(KEY_TRASH, trashItems);
  renderTrash();
  $('confirmClearTrashOverlay').classList.remove('show');
});

function updateFeeDisplay(o){
  const feeEl = document.querySelector(`[data-fee="${o.id}"]`);
  if(!feeEl) return;
  const status = getFeeStatus(o, Date.now());
  feeEl.textContent = status.text;
  feeEl.classList.toggle('over', status.over);
}
function tick(){
  if(active.length === 0) return;
  const now = Date.now();
  active.forEach(o=>{
    const timerEl = document.querySelector(`[data-timer="${o.id}"]`);
    if(timerEl) timerEl.textContent = fmtMMSS(now - o.startTs);
    updateFeeDisplay(o);
  });
}

function computeTodaySummary(){
  const today = new Date().toDateString();
  const todayOrders = orders.filter(o => new Date(o.startTs).toDateString() === today);
  $('todayCount').textContent = todayOrders.length;
  $('todayBaseSum').textContent = money(todayOrders.reduce((s,o)=> s + (o.excludeBaseFromTotal ? 0 : o.basePrice), 0));
  $('todayFeeSum').textContent = money(todayOrders.reduce((s,o)=>s+o.extraFee,0));
}

$('clearAllBtn').addEventListener('click', ()=>{
  $('confirmClearOverlay').classList.add('show');
});
$('confirmClearCancel').addEventListener('click', ()=>{
  $('confirmClearOverlay').classList.remove('show');
});
$('confirmClearOk').addEventListener('click', ()=>{
  orders = [];
  saveJSON(KEY_ORDERS, orders);
  computeTodaySummary();
  renderDetailTable();
  $('confirmClearOverlay').classList.remove('show');
});

const TAB_ID_MAP = { main: 'tabMain', detail: 'tabDetail', trash: 'tabTrash', settings: 'tabSettings' };
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.getAttribute('data-tab');
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    $(TAB_ID_MAP[tab]).classList.add('active');
    if(tab === 'detail') renderDetailTable();
    if(tab === 'trash') renderTrash();
  });
});

const KEY_THEME = 'meter_theme';
function applyTheme(theme){
  if(theme === 'light' || theme === 'cyberpunk'){
    document.documentElement.setAttribute('data-theme', theme);
  }else{
    document.documentElement.removeAttribute('data-theme');
  }
  document.querySelectorAll('.theme-option').forEach(btn=>{
    btn.classList.toggle('active', btn.getAttribute('data-theme-choice') === theme);
  });
  const metaTheme = $('themeColorMeta');
  if(metaTheme){
    const colorMap = { light: '#FFFFFF', cyberpunk: '#0A0E17', dark: '#1B1F24' };
    metaTheme.setAttribute('content', colorMap[theme] || colorMap.dark);
  }
}
document.querySelectorAll('.theme-option').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const theme = btn.getAttribute('data-theme-choice');
    applyTheme(theme);
    saveJSON(KEY_THEME, theme);
  });
});

function dayStart(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.getTime();
}
function getExportOrders(){
  const range = $('exportRange').value;
  const chronological = [...orders].reverse();
  if(range === 'today'){
    const today = new Date().toDateString();
    return chronological.filter(o => new Date(o.startTs).toDateString() === today);
  }
  if(range === 'custom'){
    const startVal = $('rangeStart').value;
    const endVal = $('rangeEnd').value;
    if(!startVal || !endVal) return [];
    const startMs = dayStart(startVal);
    const endMs = dayStart(endVal) + 24*60*60*1000;
    return chronological.filter(o => o.startTs >= startMs && o.startTs < endMs);
  }
  return chronological;
}
function fmtDateOnly(ts){
  const d = new Date(ts);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${mm}/${dd}`;
}
function fmtDateFull(ts){
  const d = new Date(ts);
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}/${mm}/${dd}`;
}
function renderDetailTable(){
  const wrap = $('exportPreviewWrap');
  const list = getExportOrders();
  $('clearAllBtn').style.display = orders.length === 0 ? 'none' : 'block';
  if(list.length === 0){
    wrap.innerHTML = '<div class="export-empty">這個範圍內沒有紀錄</div>';
    return;
  }
  const baseSum = list.reduce((s,o)=> s + (o.excludeBaseFromTotal ? 0 : o.basePrice), 0);
  const feeSum = list.reduce((s,o)=>s+o.extraFee,0);
  wrap.innerHTML = `
    <div class="export-table-scroll">
      <table class="export-table">
        <thead><tr>
          <th>編號</th><th>單號</th><th>日期</th><th>開始</th><th>結束</th><th>超時</th><th>單價</th><th>差額</th>
        </tr></thead>
        <tbody>
          ${list.map((o,i) => `
            <tr>
              <td class="row-id-cell" data-row-id="${o.id}">${i+1}</td>
              <td><input type="text" class="detail-edit-input ordno-edit-input" data-edit-ordno="${o.id}" value="${o.orderNo ? o.orderNo.replace(/"/g,'&quot;') : ''}" placeholder="-" lang="en" inputmode="text" autocapitalize="characters" autocorrect="off" autocomplete="off" spellcheck="false"></td>
              <td>${fmtDateOnly(o.startTs)}</td>
              <td><input type="text" inputmode="numeric" maxlength="5" class="detail-edit-input time-edit-input" data-edit-start="${o.id}" value="${fmtHHMM(o.startTs)}" placeholder="HH:MM"></td>
              <td><input type="text" inputmode="numeric" maxlength="5" class="detail-edit-input time-edit-input" data-edit-end="${o.id}" value="${fmtHHMM(o.endTs)}" placeholder="HH:MM"></td>
              <td>${o.extraMin}</td>
              <td>${o.excludeBaseFromTotal ? '-' : `<input type="number" class="detail-edit-input base-edit-input" data-edit-base="${o.id}" value="${o.basePrice}" min="0">`}</td>
              <td>${plainNum(o.extraFee)}</td>
            </tr>
          `).join('')}
        </tbody>
        <tfoot>
          <tr><td colspan="6">總計</td><td>${moneyExport(baseSum)}</td><td>${moneyExport(feeSum)}</td></tr>
        </tfoot>
      </table>
    </div>
    <p id="editTimeError" style="font-size:11px;color:var(--red);margin-top:6px;display:none;"></p>
    ${list.some(o=>o.excludeBaseFromTotal) ? '<p style="font-size:11px;color:var(--muted);margin-top:6px;">- 表示疊單共用單價，已計入同組主單，不重複列入總計</p>' : ''}
  `;
}
let longPressTimer = null;
let longPressStartX = 0, longPressStartY = 0;
let pendingDeleteRowId = null;

function cancelLongPress(){
  if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; }
}
$('exportPreviewWrap').addEventListener('pointerdown', e=>{
  const cell = e.target.closest('.row-id-cell');
  if(!cell) return;
  const id = cell.getAttribute('data-row-id');
  longPressStartX = e.clientX;
  longPressStartY = e.clientY;
  longPressTimer = setTimeout(()=>{
    longPressTimer = null;
    openDeleteRowConfirm(id);
  }, 600);
});
$('exportPreviewWrap').addEventListener('pointerup', cancelLongPress);
$('exportPreviewWrap').addEventListener('pointercancel', cancelLongPress);
$('exportPreviewWrap').addEventListener('pointermove', e=>{
  if(!longPressTimer) return;
  const dx = Math.abs(e.clientX - longPressStartX);
  const dy = Math.abs(e.clientY - longPressStartY);
  if(dx > 10 || dy > 10) cancelLongPress();
});
function openDeleteRowConfirm(id){
  const order = orders.find(o=>o.id===id);
  if(!order) return;
  pendingDeleteRowId = id;
  $('deleteRowInfo').textContent = `單號：${order.orderNo || '未填寫'}　${fmtDateOnly(order.startTs)} ${fmtHHMM(order.startTs)}~${fmtHHMM(order.endTs)}`;
  $('confirmDeleteRowOverlay').classList.add('show');
}
$('confirmDeleteRowCancel').addEventListener('click', ()=>{
  pendingDeleteRowId = null;
  $('confirmDeleteRowOverlay').classList.remove('show');
});
$('confirmDeleteRowOk').addEventListener('click', ()=>{
  if(pendingDeleteRowId){
    orders = orders.filter(o=>o.id!==pendingDeleteRowId);
    saveJSON(KEY_ORDERS, orders);
    computeTodaySummary();
    renderDetailTable();
  }
  pendingDeleteRowId = null;
  $('confirmDeleteRowOverlay').classList.remove('show');
});

$('exportPreviewWrap').addEventListener('input', e=>{
  const ordnoId = e.target.getAttribute('data-edit-ordno');
  if(!ordnoId) return;
  const upper = e.target.value.toUpperCase();
  if(e.target.value !== upper){
    const cursorPos = e.target.selectionStart;
    e.target.value = upper;
    e.target.setSelectionRange(cursorPos, cursorPos);
  }
});
$('exportPreviewWrap').addEventListener('change', e=>{
  const baseId = e.target.getAttribute('data-edit-base');
  const ordnoId = e.target.getAttribute('data-edit-ordno');
  const startId = e.target.getAttribute('data-edit-start');
  const endId = e.target.getAttribute('data-edit-end');

  if(baseId){
    const order = orders.find(o => o.id === baseId);
    if(order){
      const newVal = parseFloat(e.target.value) || 0;
      order.basePrice = newVal;
      order.total = newVal + order.extraFee;
      saveJSON(KEY_ORDERS, orders);
      computeTodaySummary();
      renderDetailTable();
    }
    return;
  }

  if(ordnoId){
    const order = orders.find(o => o.id === ordnoId);
    if(order){
      order.orderNo = e.target.value.toUpperCase();
      saveJSON(KEY_ORDERS, orders);
      renderDetailTable();
    }
    return;
  }

  if(startId || endId){
    const id = startId || endId;
    const order = orders.find(o => o.id === id);
    if(!order) return;
    const parsed = parseTimeInput(e.target.value);
    if(!parsed){
      const err = $('editTimeError');
      err.textContent = '時間格式看不懂，請輸入像 14:30 或 1430 這樣的格式，已還原修改';
      err.style.display = 'block';
      setTimeout(()=>{ err.style.display = 'none'; }, 3000);
      renderDetailTable();
      return;
    }
    const { h, m } = parsed;

    let newStartTs = order.startTs;
    let newEndTs = order.endTs;
    if(startId){
      const d = new Date(order.startTs);
      d.setHours(h, m, 0, 0);
      newStartTs = d.getTime();
    }else{
      const d = new Date(order.endTs);
      d.setHours(h, m, 0, 0);
      newEndTs = d.getTime();
    }

    if(newEndTs <= newStartTs){
      const err = $('editTimeError');
      err.textContent = '完成時間必須晚於開始時間，已還原修改';
      err.style.display = 'block';
      setTimeout(()=>{ err.style.display = 'none'; }, 3000);
      renderDetailTable();
      return;
    }

    order.startTs = newStartTs;
    order.endTs = newEndTs;
    const { elapsedMinCeil, thresholdMin, extraMin, extraFee } = calcFee(newStartTs, newEndTs, order.basePrice);
    order.elapsedMinCeil = elapsedMinCeil;
    order.extraMin = extraMin;
    order.extraFee = extraFee;
    order.total = (order.basePrice || 0) + extraFee;
    saveJSON(KEY_ORDERS, orders);
    computeTodaySummary();
    renderDetailTable();
  }
});
$('exportRange').addEventListener('change', ()=>{
  $('customDateRow').style.display = $('exportRange').value === 'custom' ? 'flex' : 'none';
  renderDetailTable();
});
$('rangeStart').addEventListener('change', renderDetailTable);
$('rangeEnd').addEventListener('change', renderDetailTable);
function buildExportRows(list){
  const baseSum = list.reduce((s,o)=> s + (o.excludeBaseFromTotal ? 0 : o.basePrice), 0);
  const feeSum = list.reduce((s,o)=>s+o.extraFee,0);
  const header = ['編號','單號','日期','開始','結束','超時','單價','差額','疊單共用'];
  const rows = list.map((o,i) => [
    i+1, o.orderNo || '', fmtDateFull(o.startTs), fmtHHMM(o.startTs), fmtHHMM(o.endTs), o.extraMin, o.basePrice, o.extraFee, o.excludeBaseFromTotal ? '是' : ''
  ]);
  const totalRow = ['','總計','','','','', baseSum.toFixed(1), feeSum.toFixed(1), ''];
  return { header, rows, totalRow, baseSum, feeSum };
}
function csvEscape(v){
  const s = String(v ?? '');
  return '"' + s.replace(/"/g,'""') + '"';
}
$('exportCsvBtn').addEventListener('click', ()=>{
  const list = getExportOrders();
  if(list.length === 0){ alert('這個範圍內沒有紀錄可以匯出'); return; }
  const { header, rows, totalRow } = buildExportRows(list);
  const csv = '\uFEFF' + [header, ...rows, totalRow].map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date();
  const fname = `外送紀錄_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.csv`;
  a.href = url;
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

function showImportStatus(msg){
  const el = $('importStatus');
  el.textContent = msg;
  setTimeout(()=>{ if(el.textContent === msg) el.textContent = ''; }, 5000);
}
function parseCsvLine(line){
  const result = [];
  let cur = '';
  let inQuotes = false;
  for(let i = 0; i < line.length; i++){
    const ch = line[i];
    if(inQuotes){
      if(ch === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; }
        else { inQuotes = false; }
      }else{
        cur += ch;
      }
    }else{
      if(ch === '"'){ inQuotes = true; }
      else if(ch === ','){ result.push(cur); cur = ''; }
      else { cur += ch; }
    }
  }
  result.push(cur);
  return result;
}
function parseCsvText(text){
  const clean = text.replace(/^\uFEFF/, '');
  const lines = clean.split(/\r\n|\n/).filter(l => l.trim().length > 0);
  return lines.map(parseCsvLine);
}
$('importCsvBtn').addEventListener('click', ()=> $('importCsvInput').click());
$('importCsvInput').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const rows = parseCsvText(reader.result);
      if(rows.length < 2){ showImportStatus('CSV內容是空的'); e.target.value=''; return; }
      const dataRows = rows.slice(1);
      const currentYear = new Date().getFullYear();
      const imported = [];
      dataRows.forEach(r=>{
        if(r.length < 8) return;
        const orderNo = r[1];
        if(orderNo === '總計') return;
        const dateStr = r[2];
        const startStr = r[3];
        const endStr = r[4];
        const basePrice = parseFloat(r[6]) || 0;
        const excludeBaseFromTotal = r[8] === '是' || r[8] === '1' || r[8] === 'Y';
        const dateParts = dateStr.split('/').map(n => parseInt(n));
        let yyyy, mm, dd;
        if(dateParts.length === 3){
          [yyyy, mm, dd] = dateParts;
        }else if(dateParts.length === 2){
          [mm, dd] = dateParts;
          yyyy = currentYear;
        }else{
          return;
        }
        if(!yyyy || !mm || !dd) return;
        const [sh, sm] = startStr.split(':').map(n => parseInt(n));
        const [eh, em] = endStr.split(':').map(n => parseInt(n));
        const startTs = new Date(yyyy, mm - 1, dd, sh || 0, sm || 0, 0).getTime();
        let endTs = new Date(yyyy, mm - 1, dd, eh || 0, em || 0, 0).getTime();
        if(endTs <= startTs) endTs += 24*60*60*1000;
        const { elapsedMinCeil, extraMin, extraFee } = calcFee(startTs, endTs, basePrice);
        imported.push({
          id: genId(),
          orderNo: orderNo || '',
          basePrice,
          excludeBaseFromTotal,
          startTs, endTs,
          elapsedMinCeil, extraMin, extraFee,
          total: basePrice + extraFee
        });
      });
      if(imported.length === 0){ showImportStatus('沒有讀到可匯入的紀錄，請確認CSV格式'); e.target.value=''; return; }
      orders = orders.concat(imported);
      orders.sort((a,b) => b.startTs - a.startTs);
      saveJSON(KEY_ORDERS, orders);
      computeTodaySummary();
      renderDetailTable();
      showImportStatus(`已匯入 ${imported.length} 筆紀錄`);
    }catch(err){
      showImportStatus('匯入失敗，請確認CSV格式是否正確');
    }
    e.target.value = '';
  };
  reader.readAsText(file, 'UTF-8');
});

init();
</script>
