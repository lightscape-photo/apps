<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>倒數計時器</title>
<style>
  :root {
    --ink: #14201E;
    --panel: #1B2C29;
    --paper: #F4EFE6;
    --ember: #E4653A;
    --ember-dim: #A8451F;
    --mist: #9FB3AC;
    --ok: #5FA88A;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Segoe UI", sans-serif;
    color: var(--paper);
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .rig {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .label {
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--mist);
  }

  .picker {
    display: flex;
    gap: 10px;
    width: 100%;
  }

  .picker button {
    flex: 1;
    padding: 14px 0;
    border-radius: 14px;
    border: 1.5px solid rgba(159, 179, 172, 0.3);
    background: transparent;
    color: var(--paper);
    font-size: 17px;
    font-weight: 600;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }

  .picker button.active {
    background: var(--ember);
    border-color: var(--ember);
    color: var(--ink);
  }

  .picker button:disabled {
    opacity: 0.45;
  }

  .dial {
    position: relative;
    width: min(78vw, 300px);
    height: min(78vw, 300px);
    border-radius: 50%;
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 0 1.5px rgba(159, 179, 172, 0.18);
  }

  .dial svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .dial svg circle {
    fill: none;
    stroke-width: 6;
  }

  .track { stroke: rgba(159, 179, 172, 0.15); }

  .progress {
    stroke: var(--ember);
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
  }

  .progress.done { stroke: var(--ok); }

  .readout {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .time {
    font-size: 58px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    line-height: 1;
  }

  .status {
    font-size: 14px;
    color: var(--mist);
    min-height: 18px;
    line-height: 18px;
  }

  .controls {
    display: flex;
    gap: 12px;
    width: 100%;
  }

  .controls button {
    flex: 1;
    padding: 16px 0;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  #startBtn {
    background: var(--ember);
    color: var(--ink);
  }

  #startBtn:disabled {
    background: rgba(228, 101, 58, 0.35);
    color: rgba(20, 32, 30, 0.5);
  }

  #resetBtn {
    background: transparent;
    color: var(--mist);
    border: 1.5px solid rgba(159, 179, 172, 0.3);
  }

  .dial.ringing .time { color: var(--ember); animation: pulse 0.9s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .note {
    font-size: 12px;
    color: var(--mist);
    text-align: center;
    line-height: 1.6;
    opacity: 0.75;
  }

  @media (prefers-reduced-motion: reduce) {
    .progress { transition: none; }
    .dial.ringing .time { animation: none; }
  }
</style>
</head>
<body>

<div class="rig">
  <div class="label">選擇時間</div>

  <div class="picker">
    <button id="pick3" class="active">3 分鐘</button>
    <button id="pick2">2 分鐘</button>
  </div>

  <div class="dial" id="dial">
    <svg viewBox="0 0 300 300">
      <circle class="track" cx="150" cy="150" r="138"></circle>
      <circle class="progress" id="progressRing" cx="150" cy="150" r="138"></circle>
    </svg>
    <div class="readout">
      <div class="time" id="timeDisplay">03:00</div>
      <div class="status" id="statusText"></div>
    </div>
  </div>

  <div class="controls">
    <button id="startBtn">開始</button>
    <button id="resetBtn">重置</button>
  </div>

  <div class="note">畫面開著、螢幕不熄滅時最準；若切到背景太久或螢幕自動關閉，手機瀏覽器可能暫停計時，重新打開畫面時會自動補上正確時間並補響鈴。</div>
</div>

<script>
  const timeDisplay = document.getElementById('timeDisplay');
  const statusText = document.getElementById('statusText');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const pick3 = document.getElementById('pick3');
  const pick2 = document.getElementById('pick2');
  const dial = document.getElementById('dial');
  const ring = document.getElementById('progressRing');

  const RADIUS = 138;
  const CIRC = 2 * Math.PI * RADIUS;
  ring.style.strokeDasharray = CIRC;
  ring.style.strokeDashoffset = 0;

  const STORAGE_KEY = 'countdown_timer_state_v1';

  let totalSeconds = 180;
  let remaining = totalSeconds;
  let endAt = null;       // epoch ms when timer should hit zero
  let running = false;
  let tickId = null;
  let audioCtx = null;
  let wakeLock = null;

  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return m + ':' + sec;
  }

  function updateDisplay() {
    timeDisplay.textContent = formatTime(Math.max(0, remaining));
    const fraction = totalSeconds > 0 ? remaining / totalSeconds : 0;
    ring.style.strokeDashoffset = CIRC * (1 - Math.max(0, Math.min(1, fraction)));
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        totalSeconds, endAt, running
      }));
    } catch (e) { /* 忽略儲存失敗 */ }
  }

  function clearState() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  function setDuration(minutes, sourceBtn) {
    if (running) return; // 計時中不可切換
    totalSeconds = minutes * 60;
    remaining = totalSeconds;
    [pick3, pick2].forEach(b => b.classList.remove('active'));
    sourceBtn.classList.add('active');
    ring.classList.remove('done');
    dial.classList.remove('ringing');
    statusText.textContent = '';
    clearState();
    updateDisplay();
  }

  pick3.addEventListener('click', () => setDuration(3, pick3));
  pick2.addEventListener('click', () => setDuration(2, pick2));

  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function beep(times) {
    try {
      ensureAudio();
      let t = audioCtx.currentTime;
      for (let i = 0; i < times; i++) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, t);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.35, t + 0.02);
        gain.gain.linearRampToValueAtTime(0, t + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.4);
        t += 0.5;
      }
    } catch (e) { /* 音效播放失敗時不中斷流程 */ }
    if (navigator.vibrate) {
      try { navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {}
    }
  }

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (e) { /* 裝置不支援或被拒絕時忽略 */ }
  }

  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }

  function syncFromClock() {
    if (!running || endAt === null) return;
    const secsLeft = Math.round((endAt - Date.now()) / 1000);
    remaining = Math.max(0, secsLeft);
    updateDisplay();
    if (remaining <= 0) {
      finish();
    }
  }

  function tick() {
    syncFromClock();
  }

  function finish() {
    if (tickId) { clearInterval(tickId); tickId = null; }
    running = false;
    remaining = 0;
    updateDisplay();
    ring.classList.add('done');
    dial.classList.add('ringing');
    statusText.textContent = '時間到';
    startBtn.disabled = false;
    startBtn.textContent = '開始';
    pick3.disabled = false;
    pick2.disabled = false;
    releaseWakeLock();
    clearState();
    beep(4);
    notify('時間到！', '倒數計時結束');
  }

  function notify(title, body) {
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;
    try {
      new Notification(title, {
        body: body,
        tag: 'countdown-timer',
        renotify: true,
        silent: false
      });
    } catch (e) { /* 部分手機瀏覽器需透過 Service Worker 才能發通知，失敗時忽略 */ }
  }

  function requestNotifyPermissionThenStart() {
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission().finally(runStart);
    } else {
      runStart();
    }
  }

  function runStart() {
    if (remaining <= 0) remaining = totalSeconds;
    endAt = Date.now() + remaining * 1000;
    running = true;
    dial.classList.remove('ringing');
    ring.classList.remove('done');
    statusText.textContent = '計時中';
    startBtn.disabled = true;
    startBtn.textContent = '計時中';
    pick3.disabled = true;
    pick2.disabled = true;
    requestWakeLock();
    saveState();
    if (tickId) clearInterval(tickId);
    tickId = setInterval(tick, 1000);
    const mins = Math.round(totalSeconds / 60);
    notify('倒數計時已開始', mins + ' 分鐘倒數中，時間到會再通知你');
  }

  function start() {
    if (running) return;
    ensureAudio();
    requestNotifyPermissionThenStart();
  }

  function reset() {
    if (tickId) { clearInterval(tickId); tickId = null; }
    running = false;
    endAt = null;
    remaining = totalSeconds;
    dial.classList.remove('ringing');
    ring.classList.remove('done');
    statusText.textContent = '';
    startBtn.disabled = false;
    startBtn.textContent = '開始';
    pick3.disabled = false;
    pick2.disabled = false;
    releaseWakeLock();
    clearState();
    updateDisplay();
  }

  startBtn.addEventListener('click', start);
  resetBtn.addEventListener('click', reset);

  // 頁面重新顯示時（例如切回瀏覽器分頁、螢幕重新點亮），立刻用真實時間校正一次
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) {
      syncFromClock();
      if (running && audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }
  });

  window.addEventListener('pageshow', () => {
    if (running) syncFromClock();
  });

  // 讀取上次留下的狀態：處理瀏覽器把分頁背景關閉又重新載入的情況
  (function restore() {
    let saved = null;
    try {
      saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    } catch (e) { saved = null; }

    if (saved && saved.running && saved.endAt) {
      totalSeconds = saved.totalSeconds;
      endAt = saved.endAt;
      running = true;
      if (totalSeconds === 120) {
        pick2.classList.add('active');
        pick3.classList.remove('active');
      } else {
        pick3.classList.add('active');
        pick2.classList.remove('active');
      }
      const secsLeft = Math.round((endAt - Date.now()) / 1000);
      if (secsLeft <= 0) {
        // 時間已經過了：立即補上響鈴（受限於瀏覽器政策，聲音需使用者互動才能保證播放）
        remaining = 0;
        running = false;
        updateDisplay();
        ring.classList.add('done');
        dial.classList.add('ringing');
        statusText.textContent = '時間到';
        clearState();
        beep(4);
        notify('時間到！', '倒數計時結束');
      } else {
        remaining = secsLeft;
        statusText.textContent = '計時中';
        startBtn.disabled = true;
        startBtn.textContent = '計時中';
        pick3.disabled = true;
        pick2.disabled = true;
        requestWakeLock();
        updateDisplay();
        tickId = setInterval(tick, 1000);
      }
    } else {
      updateDisplay();
    }
  })();
</script>

</body>
</html>
